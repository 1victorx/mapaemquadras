name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Montar somente os arquivos públicos do site
        run: |
          mkdir -p _site/data/generated
          cp index.html app.js styles.css _site/
          sed -i "s|app.js|app.js?v=$GITHUB_SHA|g; s|styles.css|styles.css?v=$GITHUB_SHA|g" _site/index.html
          cp data/generated/quadras.json _site/data/generated/
      - name: Enviar os arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
